<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --conch:#0ff4c6;--cmdr:#ff4f5e;
  --bg:#0b0c0f;--surface:#13151a;--surface2:#1a1d24;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#e8eaf0;--muted:#6b7280;
  --mono:'JetBrains Mono',monospace;--sans:'Space Grotesk',sans-serif;
}

/* LIGHT MODE */
:root.light-mode{
  --bg:#f5f7fa;--surface:#ffffff;--surface2:#f0f2f5;
  --border:rgba(0,0,0,0.08);--text:#1a1d24;--muted:#6b7280;
}

body{transition:background-color 0.3s ease,color 0.3s ease}

html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}

/* PAGE TRANSITION */
.page-transition{position:fixed;inset:0;background:var(--bg);z-index:9999;pointer-events:none;opacity:0;transition:opacity .25s ease}
.page-transition.fade-out{opacity:1;pointer-events:all}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1rem 2.5rem;background:rgba(11,12,15,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:64px}
.nav-logo{font-size:1.1rem;font-weight:700;display:flex;gap:.4em;align-items:center;text-decoration:none;cursor:pointer}
.nav-logo .c{color:var(--conch)}.nav-logo .sep{color:var(--muted)}.nav-logo .r{color:var(--cmdr)}
.nav-right{display:flex;align-items:center;gap:0.6rem}

/* ICON BTN */
.icon-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:8px;flex-shrink:0;transition:border-color 0.2s,background 0.2s,color 0.2s;color:var(--muted)}
.icon-btn:hover{border-color:rgba(15,244,198,0.35);background:var(--surface2);color:var(--conch)}
.icon-btn .theme-icon{font-size:1rem;transition:transform 0.3s ease}
.icon-btn:hover .theme-icon{transform:rotate(20deg)}

/* BURGER */
.burger{display:flex;flex-direction:column;justify-content:center;gap:5px;width:36px;height:36px;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px;transition:border-color 0.2s,background 0.2s;flex-shrink:0}
.burger:hover{border-color:rgba(255,255,255,0.18);background:var(--surface2)}
.burger span{display:block;height:1.5px;border-radius:2px;background:var(--muted);transition:all 0.3s;transform-origin:center}
.burger.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg);background:var(--conch)}
.burger.open span:nth-child(2){opacity:0;transform:scaleX(0)}
.burger.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);background:var(--conch)}

/* DRAWER */
.drawer-overlay{position:fixed;inset:0;z-index:98;background:rgba(0,0,0,0.5);opacity:0;pointer-events:none;transition:opacity 0.3s}
.drawer-overlay.open{opacity:1;pointer-events:all}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:99;width:280px;background:#0e1014;border-left:1px solid var(--border);transform:translateX(100%);transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:1.2rem 1.5rem;border-bottom:1px solid var(--border);height:64px}
.drawer-logo{font-size:1rem;font-weight:700;display:flex;gap:0.3em}
.drawer-logo .c{color:var(--conch)}.drawer-logo .r{color:var(--cmdr)}.drawer-logo .sep{color:var(--muted)}
.drawer-close{background:none;border:none;cursor:pointer;color:var(--muted);font-size:1.1rem;padding:0.3rem;transition:color 0.2s}
.drawer-close:hover{color:var(--text)}
.drawer-slabel{font-family:var(--mono);font-size:0.62rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);padding:1.2rem 1.5rem 0.5rem;opacity:0.6}
.drawer-nav{flex:1;overflow-y:auto;padding:0.5rem 0.75rem}
.drawer-item{display:flex;align-items:center;gap:0.75rem;padding:0.75rem;border-radius:8px;text-decoration:none;color:var(--muted);font-family:var(--mono);font-size:0.82rem;margin-bottom:2px;border:1px solid transparent;transition:background 0.18s;opacity:0;animation:drawerItemFadeIn 0.3s ease forwards}
.drawer-item:nth-child(1){animation-delay:0.05s}
.drawer-item:nth-child(2){animation-delay:0.1s}
.drawer-item:nth-child(3){animation-delay:0.15s}
.drawer-item:nth-child(4){animation-delay:0.2s}
.drawer-item:nth-child(5){animation-delay:0.25s}
.drawer-item:nth-child(6){animation-delay:0.3s}
@keyframes drawerItemFadeIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.drawer-item:hover{background:var(--surface);border-color:var(--border);color:var(--text)}
.drawer-item.active{background:rgba(15,244,198,0.07);border-color:rgba(15,244,198,0.15);color:var(--conch)}
.drawer-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:0.85rem;flex-shrink:0;background:var(--surface2);border:1px solid var(--border)}
.drawer-div{height:1px;background:var(--border);margin:0.75rem}
.drawer-footer{padding:1.2rem 1.5rem;border-top:1px solid var(--border);font-family:var(--mono);font-size:0.7rem;color:var(--muted);opacity:0.5}

.wrap{max-width:740px;margin:0 auto;padding:7rem 2rem 5rem}
.hero{text-align:center;margin-bottom:3.5rem}
.hero-badge{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;padding:.35rem .9rem;border-radius:20px;background:rgba(15,244,198,.08);color:var(--conch);border:1px solid rgba(15,244,198,.2);margin-bottom:1.2rem}
.hero h1{font-size:clamp(2.2rem,5vw,3.5rem);font-weight:700;letter-spacing:-.03em;margin-bottom:.75rem}
.hero h1 em{font-style:normal;color:var(--conch)}
.hero p{font-family:var(--mono);font-size:.85rem;color:var(--muted);max-width:420px;margin:0 auto;line-height:1.8}
.search-wrap{position:relative;margin-bottom:2rem}
.search-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem;pointer-events:none}
.search-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:.82rem;padding:.75rem 1rem .75rem 2.4rem;outline:none;transition:border-color .2s}
.search-input::placeholder{color:var(--muted)}.search-input:focus{border-color:rgba(15,244,198,.4)}
.cat-label{font-family:var(--mono);font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);opacity:.6;margin-bottom:.6rem;margin-top:2rem}
.cat-label:first-of-type{margin-top:0}
.faq-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:.5rem;overflow:hidden;transition:border-color .2s}
.faq-item:hover{border-color:rgba(255,255,255,.12)}
.faq-item.open{border-color:rgba(15,244,198,.2)}
.faq-item.hidden{display:none}
.faq-q{display:flex;align-items:center;gap:.85rem;padding:1rem 1.2rem;cursor:pointer;user-select:none}
.faq-icon{width:32px;height:32px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
.faq-q-text{flex:1;font-size:.9rem;font-weight:700;letter-spacing:-.01em}
.faq-arrow{color:var(--muted);font-size:.8rem;transition:transform .25s;flex-shrink:0}
.faq-item.open .faq-arrow{transform:rotate(180deg);color:var(--conch)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .3s cubic-bezier(.4,0,.2,1)}
.faq-item.open .faq-a{max-height:400px}
.faq-a-inner{padding:.1rem 1.2rem 1.2rem 4rem;font-family:var(--mono);font-size:.8rem;color:var(--muted);line-height:1.85}
.faq-a-inner a{color:var(--conch);text-decoration:none}.faq-a-inner a:hover{text-decoration:underline}
.faq-a-inner code{background:var(--surface2);padding:.1rem .35rem;border-radius:4px;font-size:.85em}
.no-results{font-family:var(--mono);font-size:.8rem;color:var(--muted);text-align:center;padding:3rem;opacity:.5;display:none}
.no-results.vis{display:block}
footer{text-align:center;padding:3rem 2rem;font-family:var(--mono);font-size:.7rem;color:var(--muted);border-top:1px solid var(--border);margin-top:3rem;opacity:.5}
@media(max-width:640px){nav{padding:1rem 1.2rem}.wrap{padding:5rem 1.2rem 4rem}.drawer{width:260px}}

<script>
/* DRAWER */
let _dopen=false;
function toggleDrawer(){_dopen?closeDrawer():openDrawer()}
function openDrawer(){_dopen=true;['drawer','drawer-overlay','burger-btn'].forEach(id=>document.getElementById(id).classList.add('open'));document.body.style.overflow='hidden'}
function closeDrawer(){_dopen=false;['drawer','drawer-overlay','burger-btn'].forEach(id=>document.getElementById(id).classList.remove('open'));document.body.style.overflow=''}

/* THEME TOGGLE */
function toggleTheme(){
  const root=document.documentElement;
  const icon=document.getElementById('theme-icon');
  const isDark=!root.classList.contains('light-mode');
  
  if(isDark){
    root.classList.add('light-mode');
    icon.textContent='☀️';
    localStorage.setItem('cc_theme','light');
  }else{
    root.classList.remove('light-mode');
    icon.textContent='🌙';
    localStorage.setItem('cc_theme','dark');
  }
}

function loadTheme(){
  const savedTheme=localStorage.getItem('cc_theme');
  const icon=document.getElementById('theme-icon');
  if(savedTheme==='light'){
    document.documentElement.classList.add('light-mode');
    if(icon)icon.textContent='☀️';
  }else{
    if(icon)icon.textContent='🌙';
  }
}

function renderFAQ(data){
  const container=document.getElementById('faq-container');
  container.innerHTML='';
  let uid=0;
  data.forEach(cat=>{
    const cl=document.createElement('div');cl.className='cat-label';cl.textContent=cat.cat;container.appendChild(cl);
    cat.items.forEach(item=>{
      const id='faq-'+uid++;
      const el=document.createElement('div');el.className='faq-item';el.dataset.q=(item.q+' '+item.a).toLowerCase();
      el.innerHTML=`<div class="faq-q" onclick="toggleFAQ(this.parentElement)">
        <div class="faq-icon">${item.icon}</div>
        <div class="faq-q-text">${item.q}</div>
        <span class="faq-arrow">▾</span>
      </div>
      <div class="faq-a"><div class="faq-a-inner">${item.a}</div></div>`;
      container.appendChild(el);
    });
  });
}

function toggleFAQ(el){el.classList.toggle('open')}

function filterFAQ(){
  const q=document.getElementById('faq-search').value.trim().toLowerCase();
  const items=document.querySelectorAll('.faq-item');
  const labels=document.querySelectorAll('.cat-label');
  let vis=0;
  items.forEach(it=>{const match=!q||(it.dataset.q||'').includes(q);it.classList.toggle('hidden',!match);if(match)vis++;if(q&&match)it.classList.add('open');else if(q)it.classList.remove('open');});
  labels.forEach(l=>{l.style.display='block'});
  document.getElementById('no-results').classList.toggle('vis',vis===0&&q.length>0);
}

/* PAGE TRANSITIONS */
document.querySelectorAll('a[href]').forEach(a=>{
  const href=a.getAttribute('href');
  if(!href||href.startsWith('#')||href.startsWith('http')||a.target==='_blank')return;
  a.addEventListener('click',e=>{
    e.preventDefault();
    const overlay=document.getElementById('page-transition');
    overlay.classList.add('fade-out');
    setTimeout(()=>window.location.href=href,250);
  });
});
window.addEventListener('pageshow',()=>{
  const overlay=document.getElementById('page-transition');
  if(overlay)overlay.classList.remove('fade-out');
});

/* INIT */
loadTheme();
renderFAQ(FAQ);
</script>
</body>
