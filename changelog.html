<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conch & Cmdr — Changelog</title>
<meta name="description" content="Full release history and changelog for Conch, Cmdr, and Sentinel — every version, every change.">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --conch:#0ff4c6;--conch-dim:#0bb88e;
  --cmdr:#ff4f5e;--cmdr-dim:#c8333f;
  --beta-c:#34d399;--beta-r:#a78bfa;
  --sentinel:#ff3da6;--sentinel-dim:#d92a86;
  --bg:#0b0c0f;--surface:#13151a;--surface2:#1a1d24;
  --border:rgba(255,255,255,0.07);--text:#e8eaf0;--muted:#6b7280;
  --mono:'JetBrains Mono',monospace;--sans:'Space Grotesk',sans-serif;
}
:root.light-mode{
  --bg:#f5f7fa;--surface:#ffffff;--surface2:#f0f2f5;
  --border:rgba(0,0,0,0.08);--text:#1a1d24;--muted:#6b7280;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1rem 2.5rem;background:rgba(11,12,15,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);height:64px}
.nav-logo{font-size:1.1rem;font-weight:700;letter-spacing:-.02em;display:flex;gap:.4em;align-items:center;text-decoration:none;user-select:none}
.nav-logo .c{color:var(--conch)}.nav-logo .r{color:var(--cmdr)}.nav-logo .s{color:var(--muted)}
.nav-right{display:flex;align-items:center;gap:.6rem}
.nav-back{font-family:var(--mono);font-size:.75rem;padding:.4rem .9rem;border-radius:6px;border:1px solid var(--border);background:none;color:var(--muted);text-decoration:none;transition:all .2s}
.nav-back:hover{color:var(--text);border-color:rgba(255,255,255,.2)}
.icon-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:8px;transition:all .2s;color:var(--muted);font-size:1rem}
.icon-btn:hover{border-color:rgba(15,244,198,.35);color:var(--conch)}

/* HERO */
.hero{padding:7rem 2.5rem 3.5rem;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-80px;left:50%;transform:translateX(-50%);width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(15,244,198,.05) 0%,transparent 70%);pointer-events:none}
.hero-tag{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;padding:.35rem .85rem;border-radius:20px;background:rgba(15,244,198,.08);border:1px solid rgba(15,244,198,.2);color:var(--conch);margin-bottom:1.2rem}
.hero h1{font-size:clamp(2.5rem,6vw,4.5rem);font-weight:700;line-height:1.05;letter-spacing:-.03em;margin-bottom:.85rem}
.hero h1 em{font-style:normal;color:var(--conch)}
.hero-sub{font-family:var(--mono);font-size:.85rem;color:var(--muted);line-height:1.8;max-width:480px;margin:0 auto 2rem}

/* FILTER BAR */
.filter-bar{max-width:900px;margin:0 auto 2.5rem;padding:0 2.5rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.filter-btn{font-family:var(--mono);font-size:.72rem;padding:.4rem .9rem;border-radius:20px;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;transition:all .2s;user-select:none}
.filter-btn:hover{color:var(--text);border-color:rgba(255,255,255,.2)}
.filter-btn.active-all{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.2);color:var(--text)}
.filter-btn.active-conch{background:rgba(15,244,198,.08);border-color:rgba(15,244,198,.3);color:var(--conch)}
.filter-btn.active-cmdr{background:rgba(255,79,94,.08);border-color:rgba(255,79,94,.3);color:var(--cmdr)}
.filter-btn.active-beta-c{background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.3);color:var(--beta-c)}
.filter-btn.active-beta-r{background:rgba(167,139,250,.08);border-color:rgba(167,139,250,.3);color:var(--beta-r)}
.filter-btn.active-sentinel{background:rgba(255,61,166,.08);border-color:rgba(255,61,166,.3);color:var(--sentinel)}
.filter-sep{width:1px;height:20px;background:var(--border)}
.search-wrap{position:relative;margin-left:auto}
.search-input{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:.75rem;padding:.4rem 2rem .4rem .85rem;outline:none;transition:border-color .2s;width:200px}
.search-input:focus{border-color:rgba(15,244,198,.35)}
.search-input::placeholder{color:var(--muted);opacity:.5}
.search-clear-btn{position:absolute;right:.5rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:.8rem;display:none}
.search-clear-btn.vis{display:block}

/* TIMELINE */
.timeline{max-width:900px;margin:0 auto;padding:0 2.5rem 5rem;position:relative}
.timeline::before{content:'';position:absolute;left:calc(2.5rem + 19px);top:0;bottom:0;width:1px;background:linear-gradient(to bottom,transparent,var(--border) 5%,var(--border) 95%,transparent)}

/* RELEASE CARD */
.release{display:flex;gap:1.5rem;margin-bottom:2.5rem;position:relative;animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.release.hidden{display:none}

/* TIMELINE DOT */
.release-dot{flex-shrink:0;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;position:relative;z-index:1;border:2px solid var(--border);background:var(--surface);margin-top:.2rem}
.release-dot.dc{border-color:rgba(15,244,198,.4);background:rgba(15,244,198,.08);box-shadow:0 0 12px rgba(15,244,198,.15)}
.release-dot.dr{border-color:rgba(255,79,94,.4);background:rgba(255,79,94,.08);box-shadow:0 0 12px rgba(255,79,94,.15)}
.release-dot.dbc{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.08);box-shadow:0 0 12px rgba(52,211,153,.15)}
.release-dot.dbr{border-color:rgba(167,139,250,.4);background:rgba(167,139,250,.08);box-shadow:0 0 12px rgba(167,139,250,.15)}
.release-dot.ds{border-color:rgba(255,61,166,.4);background:rgba(255,61,166,.08);box-shadow:0 0 12px rgba(255,61,166,.15)}

/* CARD */
.release-card{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .2s,transform .2s}
.release-card:hover{transform:translateX(3px)}
.release-card.tc{border-left:3px solid rgba(15,244,198,.4)}.release-card.tc:hover{border-color:rgba(15,244,198,.5)}
.release-card.tr{border-left:3px solid rgba(255,79,94,.4)}.release-card.tr:hover{border-color:rgba(255,79,94,.5)}
.release-card.tbc{border-left:3px solid rgba(52,211,153,.4)}.release-card.tbc:hover{border-color:rgba(52,211,153,.5)}
.release-card.tbr{border-left:3px solid rgba(167,139,250,.4)}.release-card.tbr:hover{border-color:rgba(167,139,250,.5)}
.release-card.ts{border-left:3px solid rgba(255,61,166,.4)}.release-card.ts:hover{border-color:rgba(255,61,166,.5)}

.card-head{display:flex;align-items:flex-start;justify-content:space-between;padding:1rem 1.2rem;gap:1rem;flex-wrap:wrap}
.card-left{display:flex;flex-direction:column;gap:.4rem}
.card-title-row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.card-version{font-family:var(--mono);font-size:.9rem;font-weight:700;color:var(--text)}
.card-type{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;padding:.18rem .5rem;border-radius:4px}
.ct-c{background:rgba(15,244,198,.1);color:var(--conch);border:1px solid rgba(15,244,198,.2)}
.ct-r{background:rgba(255,79,94,.1);color:var(--cmdr);border:1px solid rgba(255,79,94,.2)}
.ct-bc{background:rgba(52,211,153,.1);color:var(--beta-c);border:1px solid rgba(52,211,153,.2)}
.ct-br{background:rgba(167,139,250,.1);color:var(--beta-r);border:1px solid rgba(167,139,250,.2)}
.ct-s{background:rgba(255,61,166,.1);color:var(--sentinel);border:1px solid rgba(255,61,166,.2)}
.badge-new-rel{font-family:var(--mono);font-size:.58rem;padding:.12rem .4rem;border-radius:3px;background:rgba(255,200,50,.12);color:#ffc832;border:1px solid rgba(255,200,50,.25)}
.card-meta{font-family:var(--mono);font-size:.7rem;color:var(--muted);display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.card-meta-dot{opacity:.4}

.card-actions{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.card-gh-link{font-family:var(--mono);font-size:.7rem;padding:.32rem .7rem;border-radius:6px;border:1px solid var(--border);background:none;color:var(--muted);text-decoration:none;transition:all .2s;display:flex;align-items:center;gap:.3rem}
.card-gh-link:hover{border-color:rgba(255,255,255,.2);color:var(--text)}
.card-toggle{font-family:var(--mono);font-size:.7rem;padding:.32rem .7rem;border-radius:6px;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:.3rem}
.card-toggle:hover{border-color:rgba(255,255,255,.2);color:var(--text)}
.card-toggle .arr{transition:transform .25s;display:inline-block}
.card-toggle.open .arr{transform:rotate(180deg)}

/* ASSETS */
.card-assets{padding:0 1.2rem .85rem;display:flex;flex-wrap:wrap;gap:.4rem}
.asset-pill{display:inline-flex;align-items:center;gap:.35rem;font-family:var(--mono);font-size:.7rem;padding:.3rem .65rem;border-radius:5px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);text-decoration:none;transition:all .2s;cursor:pointer}
.asset-pill:hover{color:var(--text);border-color:rgba(255,255,255,.18)}
.asset-pill.apc{color:var(--conch);border-color:rgba(15,244,198,.2);background:rgba(15,244,198,.05)}
.asset-pill.apr{color:var(--cmdr);border-color:rgba(255,79,94,.2);background:rgba(255,79,94,.05)}
.asset-pill.apbc{color:var(--beta-c);border-color:rgba(52,211,153,.2);background:rgba(52,211,153,.05)}
.asset-pill.apbr{color:var(--beta-r);border-color:rgba(167,139,250,.2);background:rgba(167,139,250,.05)}
.asset-pill.aps{color:var(--sentinel);border-color:rgba(255,61,166,.2);background:rgba(255,61,166,.05)}

/* BODY / NOTES */
.card-body{overflow:hidden;max-height:0;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.card-body.open{max-height:600px}
.card-body-inner{padding:.75rem 1.2rem 1rem;border-top:1px solid var(--border)}
.release-notes{font-family:var(--mono);font-size:.78rem;color:var(--muted);line-height:1.9;white-space:pre-wrap;word-break:break-word}
.release-notes-empty{font-family:var(--mono);font-size:.75rem;color:var(--muted);opacity:.5;font-style:italic}

/* SKELETON */
.skel-release{display:flex;gap:1.5rem;margin-bottom:2.5rem}
.skel-dot{width:38px;height:38px;border-radius:50%;flex-shrink:0}
.skel-card{flex:1;border-radius:12px;height:80px}
.skel{background:linear-gradient(90deg,var(--surface2) 25%,rgba(255,255,255,.04) 50%,var(--surface2) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:6px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* EMPTY / ERROR */
.state-msg{text-align:center;padding:4rem 2rem;font-family:var(--mono);font-size:.82rem;color:var(--muted);line-height:1.8}
.state-msg-icon{font-size:2.5rem;margin-bottom:.75rem;display:block}

/* STATS BAR */
.stats-bar{max-width:900px;margin:0 auto 2rem;padding:0 2.5rem;display:flex;gap:1rem;flex-wrap:wrap}
.stat-pill{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.5rem .85rem;display:flex;align-items:center;gap:.5rem;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.stat-pill strong{color:var(--text)}

/* TOAST */
#toast-c{position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem;pointer-events:none}
.toast{display:flex;align-items:center;gap:.6rem;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.7rem 1rem;font-family:var(--mono);font-size:.74rem;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.4);pointer-events:all;animation:tIn .25s ease;position:relative;overflow:hidden;min-width:200px}
.toast.out{opacity:0;transform:translateX(10px);transition:all .25s}
@keyframes tIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.tbar{position:absolute;bottom:0;left:0;height:2px;animation:tb linear forwards}
@keyframes tb{from{width:100%}to{width:0%}}

footer{text-align:center;padding:3rem 2.5rem;font-family:var(--mono);font-size:.72rem;color:var(--muted);border-top:1px solid var(--border);opacity:.5}

@media(max-width:640px){
  nav{padding:1rem 1.2rem}
  .hero{padding:6rem 1.2rem 2.5rem}
  .filter-bar{padding:0 1.2rem}
  .timeline{padding:0 1.2rem 4rem}
  .timeline::before{left:calc(1.2rem + 19px)}
  .release{gap:1rem}
  .stats-bar{padding:0 1.2rem}
  .search-wrap{margin-left:0;width:100%}
  .search-input{width:100%}
}

  /* ── ANNOUNCEMENTS ── */
  .ann-wrap{max-width:900px;margin:0 auto 2rem;padding:0 2.5rem}
  .ann-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.85rem}
  .ann-title{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:.5rem}
  .ann-title::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--conch);box-shadow:0 0 6px rgba(15,244,198,.6)}
  .ann-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:.75rem;animation:fadeUp .35s ease both}
  .ann-card-inner{padding:1rem 1.2rem;display:flex;gap:1rem;align-items:flex-start}
  .ann-type-dot{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
  .ann-t-info{background:rgba(100,160,255,.1);border:1px solid rgba(100,160,255,.2);color:#64a0ff}
  .ann-t-update{background:rgba(15,244,198,.1);border:1px solid rgba(15,244,198,.2);color:var(--conch)}
  .ann-t-hotfix{background:rgba(255,79,94,.1);border:1px solid rgba(255,79,94,.2);color:var(--cmdr)}
  .ann-t-warning{background:rgba(255,200,50,.1);border:1px solid rgba(255,200,50,.2);color:#ffc832}
  .ann-body{flex:1;min-width:0}
  .ann-head-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem;flex-wrap:wrap}
  .ann-ann-title{font-family:var(--mono);font-size:.82rem;font-weight:700;color:var(--text)}
  .ann-badge{font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;padding:.15rem .45rem;border-radius:3px}
  .ann-badge-info{background:rgba(100,160,255,.1);color:#64a0ff;border:1px solid rgba(100,160,255,.2)}
  .ann-badge-update{background:rgba(15,244,198,.1);color:var(--conch);border:1px solid rgba(15,244,198,.2)}
  .ann-badge-hotfix{background:rgba(255,79,94,.1);color:var(--cmdr);border:1px solid rgba(255,79,94,.2)}
  .ann-badge-warning{background:rgba(255,200,50,.1);color:#ffc832;border:1px solid rgba(255,200,50,.2)}
  .ann-text{font-family:var(--mono);font-size:.76rem;color:var(--muted);line-height:1.8;white-space:pre-wrap;word-break:break-word}
  .ann-date{font-family:var(--mono);font-size:.67rem;color:var(--muted);opacity:.5;margin-top:.4rem}
  .ann-card.bt-info{border-left:3px solid rgba(100,160,255,.4)}
  .ann-card.bt-update{border-left:3px solid rgba(15,244,198,.4)}
  .ann-card.bt-hotfix{border-left:3px solid rgba(255,79,94,.4)}
  .ann-card.bt-warning{border-left:3px solid rgba(255,200,50,.4)}
  .ann-empty{font-family:var(--mono);font-size:.75rem;color:var(--muted);opacity:.5;text-align:center;padding:1rem}

  /* Respect OS-level "reduce motion" accessibility setting automatically */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>

<script>
/* ── CC SETTINGS LOADER ── */
(function(){
  function get(key,def){return localStorage.getItem(key)??def;}
  /* Theme */
  const useSystem=get('cc_system_theme','0')==='1';
  if(useSystem){
    document.documentElement.classList.toggle('light-mode',window.matchMedia('(prefers-color-scheme:light)').matches);
  }else{
    if(get('cc_theme','dark')==='light')document.documentElement.classList.add('light-mode');
  }
  /* Accent color */
  const accent=get('cc_accent','#0ff4c6');
  if(accent&&accent!=='#0ff4c6')document.documentElement.style.setProperty('--conch',accent);
  /* Animations */
  if(get('cc_animations','1')==='0'){
    const s=document.createElement('style');
    s.textContent='*{animation-duration:0.001ms!important;transition-duration:0.001ms!important}';
    document.head.appendChild(s);
  }
})();
</script>
<script src="i18n.js"></script>
<script src="config.js"></script>
<script src="cc-errors.js"></script>
</head>
<body>

<div id="toast-c"></div>

<nav>
  <a class="nav-logo" href="download.html"><span class="c">Conch</span><span class="s">/</span><span class="r">Cmdr</span></a>
  <div class="nav-right">
    <a class="nav-back" href="download.html">← Downloads</a>
    <button class="icon-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle Theme">🌙</button>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <div class="hero-tag">📋 Release History</div>
  <h1>What's <em>New</em></h1>
  <p class="hero-sub"><span data-t="changelog_sub">Every release, every change — all in one place.</span></p>
</div>

<!-- STATS -->
<!-- ANNOUNCEMENTS -->
<div class="ann-wrap" id="ann-wrap" style="display:none">
  <div class="ann-header">
    <div class="ann-title">📌 Announcements</div>
  </div>
  <div id="ann-list"></div>
</div>

<div class="stats-bar" id="stats-bar" style="display:none">
  <div class="stat-pill">📦 <strong id="stat-total">—</strong> releases</div>
  <div class="stat-pill" style="color:var(--conch)">◈ <strong id="stat-conch">—</strong> Conch</div>
  <div class="stat-pill" style="color:var(--cmdr)">◈ <strong id="stat-cmdr">—</strong> Cmdr</div>
  <div class="stat-pill" style="color:var(--beta-c)">🧪 <strong id="stat-beta">—</strong> Beta</div>
  <div class="stat-pill" style="color:var(--sentinel)">◈ <strong id="stat-sentinel">—</strong> Sentinel</div>
  <div class="stat-pill" style="margin-left:auto;color:var(--muted)">🕐 Updated <strong id="stat-updated">—</strong></div>
</div>

<!-- FILTER BAR -->
<div class="filter-bar">
  <button class="filter-btn active-all" data-filter="all" onclick="setFilter('all',this)">All</button>
  <button class="filter-btn" data-filter="conch" onclick="setFilter('conch',this)" style="color:var(--conch)">◈ Conch</button>
  <button class="filter-btn" data-filter="cmdr" onclick="setFilter('cmdr',this)" style="color:var(--cmdr)">◈ Cmdr</button>
  <button class="filter-btn" data-filter="sentinel" onclick="setFilter('sentinel',this)" style="color:var(--sentinel)">◈ Sentinel</button>
  <div class="filter-sep"></div>
  <button class="filter-btn" data-filter="beta-c" onclick="setFilter('beta-c',this)" style="color:var(--beta-c)">🧪 Conch Beta</button>
  <button class="filter-btn" data-filter="beta-r" onclick="setFilter('beta-r',this)" style="color:var(--beta-r)">🔬 Cmdr Beta</button>
  <div class="filter-sep"></div>
  <div class="search-wrap">
    <input class="search-input" id="search-input" type="text" placeholder="Search releases..." oninput="doSearch(this.value)">
    <button class="search-clear-btn" id="search-clear" onclick="clearSearch()">✕</button>
  </div>
</div>

<!-- TIMELINE -->
<div class="timeline" id="timeline">
  <!-- Skeletons shown while loading -->
  <div class="skel-release" id="skel1"><div class="skel skel-dot"></div><div class="skel skel-card" style="flex:1"></div></div>
  <div class="skel-release" id="skel2"><div class="skel skel-dot"></div><div class="skel skel-card" style="flex:1"></div></div>
  <div class="skel-release" id="skel3"><div class="skel skel-dot"></div><div class="skel skel-card" style="flex:1"></div></div>
  <div class="skel-release" id="skel4"><div class="skel skel-dot"></div><div class="skel skel-card" style="flex:1"></div></div>
</div>

<div class="state-msg" id="empty-msg" style="display:none">
  <span class="state-msg-icon">🔍</span>
  No releases match your search.
</div>

<footer>Conch & Cmdr — Changelog</footer>

<script>
const GITHUB_REPO=window.CC_CONFIG.GITHUB_REPO;
const MAX_RELEASES=50; /* page-specific: shows more history than the downloads page */

let allReleases=[];
let currentFilter='all';
let currentSearch='';

/* ── THEME ── */
function toggleTheme(){
  const root=document.documentElement,btn=document.getElementById('theme-btn');
  const isDark=!root.classList.contains('light-mode');
  if(isDark){root.classList.add('light-mode');btn.textContent='☀️';localStorage.setItem('cc_theme','light');}
  else{root.classList.remove('light-mode');btn.textContent='🌙';localStorage.setItem('cc_theme','dark');}
}
(function(){
  const s=localStorage.getItem('cc_theme'),btn=document.getElementById('theme-btn');
  if(s==='light'){document.documentElement.classList.add('light-mode');if(btn)btn.textContent='☀️';}
})();

/* ── TOAST ── */
function toast(msg,type='ok',dur=3000){
  const c=document.getElementById('toast-c'),el=document.createElement('div');
  el.className='toast';
  const col={ok:'#3cc878',err:'#ff4f5e',info:'#0ff4c6'}[type]||'#0ff4c6';
  el.innerHTML=`<span style="color:${col}">${{ok:'✓',err:'✕',info:'⚑'}[type]||'⚑'}</span><span style="flex:1">${msg}</span><div class="tbar" style="background:${col};animation-duration:${dur}ms"></div>`;
  c.appendChild(el);setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),280)},dur);
}

/* ── UTILS ── */
function fmtB(b){if(!b)return'0 B';const k=1024,s=['B','KB','MB'],i=Math.floor(Math.log(b)/Math.log(k));return parseFloat((b/Math.pow(k,i)).toFixed(1))+' '+s[i]}
function fmtDate(s){if(!s)return'—';return new Date(s).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}
function fmtDateShort(s){if(!s)return'—';return new Date(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function timeAgo(s){
  const diff=(Date.now()-new Date(s))/1000;
  if(diff<60)return'just now';
  if(diff<3600)return Math.floor(diff/60)+'m ago';
  if(diff<86400)return Math.floor(diff/3600)+'h ago';
  if(diff<604800)return Math.floor(diff/86400)+'d ago';
  return fmtDateShort(s);
}
function eh(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

/* ── CLASSIFY ASSET ── */
function classify(name){
  const lo=name.toLowerCase();
  const isSentinel=lo.includes('sentinel');
  const isConch=lo.includes('conch');
  const isCmdr=lo.includes('cmdr');
  const isBeta=lo.includes('beta');
  /* Sentinel takes top priority, same as download.html's fetchReleases() */
  if(isSentinel)return'sentinel';
  if(isConch&&isBeta)return'beta-c';
  if(isCmdr&&isBeta)return'beta-r';
  if(isConch)return'conch';
  if(isCmdr)return'cmdr';
  return'other';
}

function typeLabel(t){return{conch:'Conch',cmdr:'Cmdr','beta-c':'Conch Beta','beta-r':'Cmdr Beta',sentinel:'Sentinel',other:'Other'}[t]||t}
function dotClass(t){return{conch:'dc',cmdr:'dr','beta-c':'dbc','beta-r':'dbr',sentinel:'ds',other:''}[t]||''}
function cardClass(t){return{conch:'tc',cmdr:'tr','beta-c':'tbc','beta-r':'tbr',sentinel:'ts',other:''}[t]||''}
function typeClass(t){return{conch:'ct-c',cmdr:'ct-r','beta-c':'ct-bc','beta-r':'ct-br',sentinel:'ct-s',other:''}[t]||''}
function assetClass(t){return{conch:'apc',cmdr:'apr','beta-c':'apbc','beta-r':'apbr',sentinel:'aps',other:''}[t]||''}
function typeIcon(t){return{conch:'🧩',cmdr:'⚔️','beta-c':'🧪','beta-r':'🔬',sentinel:'◈',other:'📦'}[t]||'📦'}

/* ── DETERMINE RELEASE TYPE ── */
function releaseType(assets){
  const types=new Set(assets.filter(a=>a.name.toLowerCase().endsWith('.rbxm')).map(a=>classify(a.name)));
  if(types.size===0)return'other';
  /* Sentinel takes top priority — a release with any sentinel asset is tagged Sentinel */
  if(types.has('sentinel'))return'sentinel';
  /* Priority: if mixed, show dominant */
  if(types.has('conch')&&!types.has('cmdr')&&!types.has('beta-c')&&!types.has('beta-r'))return'conch';
  if(types.has('cmdr')&&!types.has('conch')&&!types.has('beta-c')&&!types.has('beta-r'))return'cmdr';
  if(types.has('beta-c')&&types.size===1)return'beta-c';
  if(types.has('beta-r')&&types.size===1)return'beta-r';
  return [...types][0];
}

/* ── FETCH RELEASES ── */
async function fetchReleases(){
  try{
    const r=await fetch(`https://api.github.com/repos/${GITHUB_REPO}/releases?per_page=${MAX_RELEASES}&_=${Date.now()}`);
    if(!r.ok)throw new Error('HTTP '+r.status);
    allReleases=await r.json();

    /* Remove skeletons */
    ['skel1','skel2','skel3','skel4'].forEach(id=>{const el=document.getElementById(id);if(el)el.remove();});

    if(!allReleases.length){
      document.getElementById('timeline').innerHTML='<div class="state-msg"><span class="state-msg-icon">📭</span>No releases found yet.</div>';
      return;
    }

    /* Stats */
    let nConch=0,nCmdr=0,nBeta=0,nSentinel=0;
    allReleases.forEach(rel=>{
      const t=releaseType(rel.assets||[]);
      if(t==='conch')nConch++;
      else if(t==='cmdr')nCmdr++;
      else if(t==='beta-c'||t==='beta-r')nBeta++;
      else if(t==='sentinel')nSentinel++;
    });
    document.getElementById('stat-total').textContent=allReleases.length;
    document.getElementById('stat-conch').textContent=nConch;
    document.getElementById('stat-cmdr').textContent=nCmdr;
    document.getElementById('stat-beta').textContent=nBeta;
    document.getElementById('stat-sentinel').textContent=nSentinel;
    document.getElementById('stat-updated').textContent=timeAgo(allReleases[0].published_at);
    document.getElementById('stats-bar').style.display='flex';

    renderAll();
  }catch(e){
    ['skel1','skel2','skel3','skel4'].forEach(id=>{const el=document.getElementById(id);if(el)el.remove();});
    document.getElementById('timeline').innerHTML=`<div class="state-msg"><span class="state-msg-icon">❌</span>Releases unavailable right now.</div>`;
    if(window.CCErrors)CCErrors.report('release history');
  }
}

/* ── RENDER ── */
function renderAll(){
  const timeline=document.getElementById('timeline');
  const emptyMsg=document.getElementById('empty-msg');
  timeline.innerHTML='';

  const q=currentSearch.toLowerCase();
  let visible=0;

  allReleases.forEach((rel,idx)=>{
    const assets=(rel.assets||[]).filter(a=>a.name.toLowerCase().endsWith('.rbxm'));
    const type=releaseType(rel.assets||[]);
    const isNew=(Date.now()-new Date(rel.published_at))<7*24*3600*1000;
    const tagName=rel.tag_name||rel.name||'v?';
    const body=rel.body||'';

    /* Filter */
    if(currentFilter!=='all'&&type!==currentFilter){return;}

    /* Search */
    if(q&&!tagName.toLowerCase().includes(q)&&!body.toLowerCase().includes(q)&&!assets.some(a=>a.name.toLowerCase().includes(q))){return;}

    visible++;
    const id='rel-'+idx;

    /* Asset pills */
    const assetHTML=assets.map(a=>{
      const ac=classify(a.name);
      return `<a class="asset-pill ${assetClass(ac)}" href="${eh(a.browser_download_url)}" download="${eh(a.name)}" onclick="event.stopPropagation();trackDl('${eh(a.name)}')" title="${eh(a.name)} · ${fmtB(a.size)}">↓ ${eh(a.name)}</a>`;
    }).join('');

    /* Notes */
    const notesHTML=body.trim()
      ?`<pre class="release-notes">${eh(body.trim())}</pre>`
      :`<div class="release-notes-empty">No release notes provided.</div>`;

    /* Has body or assets to expand */
    const hasDetails=body.trim()||assets.length>0;

    const el=document.createElement('div');
    el.className='release';
    el.dataset.type=type;
    el.dataset.tag=tagName.toLowerCase();
    el.style.animationDelay=(idx*0.04)+'s';
    el.id=id;

    el.innerHTML=`
      <div class="release-dot ${dotClass(type)}">${typeIcon(type)}</div>
      <div class="release-card ${cardClass(type)}">
        <div class="card-head">
          <div class="card-left">
            <div class="card-title-row">
              <span class="card-version">${eh(tagName)}</span>
              <span class="card-type ${typeClass(type)}">${typeLabel(type)}</span>
              ${isNew?'<span class="badge-new-rel">NEW</span>':''}
            </div>
            <div class="card-meta">
              <span>📅 ${fmtDate(rel.published_at)}</span>
              <span class="card-meta-dot">·</span>
              <span>${timeAgo(rel.published_at)}</span>
              ${assets.length?`<span class="card-meta-dot">·</span><span>📦 ${assets.length} file${assets.length>1?'s':''}</span>`:''}
              ${rel.prerelease?'<span class="card-meta-dot">·</span><span style="color:#ffc832">⚠️ Pre-release</span>':''}
            </div>
          </div>
          <div class="card-actions">
            ${hasDetails?`<button class="card-toggle" id="toggle-${id}" onclick="toggleCard('${id}')"><span>Notes</span><span class="arr">▾</span></button>`:''}
          </div>
        </div>
        ${assets.length?`<div class="card-assets">${assetHTML}</div>`:''}
        ${hasDetails?`<div class="card-body" id="body-${id}"><div class="card-body-inner">${notesHTML}</div></div>`:''}
      </div>`;

    timeline.appendChild(el);
  });

  emptyMsg.style.display=visible===0?'block':'none';
}

/* ── TOGGLE CARD NOTES ── */
function toggleCard(id){
  const body=document.getElementById('body-'+id);
  const btn=document.getElementById('toggle-'+id);
  if(!body)return;
  const isOpen=body.classList.contains('open');
  body.classList.toggle('open',!isOpen);
  if(btn)btn.classList.toggle('open',!isOpen);
}

/* ── FILTER ── */
function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>{
    b.className='filter-btn';
    if(b.dataset.filter==='conch')b.style.color='var(--conch)';
    else if(b.dataset.filter==='cmdr')b.style.color='var(--cmdr)';
    else if(b.dataset.filter==='beta-c')b.style.color='var(--beta-c)';
    else if(b.dataset.filter==='beta-r')b.style.color='var(--beta-r)';
    else if(b.dataset.filter==='sentinel')b.style.color='var(--sentinel)';
    else b.style.color='';
  });
  btn.classList.add('active-'+f);
  renderAll();
}

/* ── SEARCH ── */
function doSearch(val){
  currentSearch=val;
  document.getElementById('search-clear').classList.toggle('vis',val.length>0);
  renderAll();
}
function clearSearch(){
  document.getElementById('search-input').value='';
  doSearch('');
}

/* ── TRACK DOWNLOAD ── */
function trackDl(name){
  try{
    const key='dlc_'+name;
    const n=parseInt(localStorage.getItem(key)||'0')+1;
    localStorage.setItem(key,n);
  }catch{}
  toast('↓ Downloading '+name,'info',2500);
}

/* ── SUPABASE ── */
const SB_URL=window.CC_CONFIG.SB_URL;
const SB_KEY=window.CC_CONFIG.SB_KEY;

/* ── LOAD ANNOUNCEMENTS ── */
async function loadAnnouncements(){
  try{
    const r=await fetch(SB_URL+'/rest/v1/cc_announcements?select=*&order=created_at.desc&active=eq.true',{
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
    });
    if(!r.ok)return;
    const rows=await r.json();
    if(!rows||!rows.length)return;

    const list=document.getElementById('ann-list');
    const wrap=document.getElementById('ann-wrap');
    wrap.style.display='block';

    const typeIcon={info:'ℹ️',update:'🚀',hotfix:'🔧',warning:'⚠️'};
    const typeLabel={info:'Info',update:'Update',hotfix:'Hotfix',warning:'Warning'};

    list.innerHTML=rows.map(a=>`
      <div class="ann-card bt-${eh(a.type||'info')}">
        <div class="ann-card-inner">
          <div class="ann-type-dot ann-t-${eh(a.type||'info')}">${typeIcon[a.type]||'📢'}</div>
          <div class="ann-body">
            <div class="ann-head-row">
              <span class="ann-ann-title">${eh(a.title)}</span>
              <span class="ann-badge ann-badge-${eh(a.type||'info')}">${typeLabel[a.type]||a.type}</span>
            </div>
            <div class="ann-text">${eh(a.message)}</div>
            <div class="ann-date">Posted ${timeAgo(a.created_at)} · by ${eh(a.author||'Admin')}</div>
          </div>
        </div>
      </div>`).join('');
  }catch(e){}
}

/* ── INIT ── */
fetchReleases();
loadAnnouncements();
</script>
<script src="cursor-trail.js"></script>
<script src="seasonal.js"></script>
</body>
</html>
